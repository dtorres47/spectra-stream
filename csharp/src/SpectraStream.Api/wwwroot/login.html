<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <title>Sign in</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #b8e6b8;
            font-family: 'Courier New', monospace;
        }

        form {
            display: flex;
            gap: 8px;
            padding: 24px;
            border: 1px solid rgba(0, 255, 0, 0.55);
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3), 0 0 12px rgba(0, 255, 0, 0.25);
        }

        input {
            padding: 10px 12px;
            background: #050a05;
            color: #b8e6b8;
            border: 1px solid rgba(0, 255, 0, 0.55);
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

            input:focus {
                outline: none;
                border-color: #00ff00;
                box-shadow: 0 0 6px rgba(0, 255, 0, 0.4);
            }

        button {
            padding: 10px 16px;
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
        }

            button:hover {
                background: #00ff00;
                color: #000;
                box-shadow: 0 0 10px #00ff00;
            }

        #msg {
            position: fixed;
            bottom: 24px;
            color: #ff4444;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <form id="loginForm">
        <input id="key" type="password" autocomplete="current-password" autofocus />
        <button type="submit">Sign in</button>
    </form>
    <div id="msg"></div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const body = new FormData();
            body.append("key", document.getElementById("key").value);

            const res = await fetch("/api/admin/login", { method: "POST", body });

            if (res.ok) {
                window.location.href = "/admin";
            } else {
                document.getElementById("msg").textContent = "Sign in failed.";
                document.getElementById("key").value = "";
            }
        });
    </script>
</body>
</html>
